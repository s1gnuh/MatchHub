<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MatchHub – Football Schedule</title>
    <meta name="description" content="Upcoming football fixtures from top leagues. Search by team or competition." />
    <meta name="theme-color" content="#0a0a0a" />
    <style>
      /* Shown while the JS bundle downloads, so a first-time visitor sees the themed splash immediately
         instead of a blank screen. Mirrors src/components/Splash.jsx, which takes over once React mounts
         (same logo badge + shimmer bar) so there is no visible swap between the two. Plain CSS only: the
         Tailwind build isn't loaded yet. */
      html, body { margin: 0; background: #0a0a0a; color: #f5f5f5; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: #0a0a0a; }
      #boot .glow { position: absolute; width: 144px; height: 144px; border-radius: 50%; background: radial-gradient(circle, rgba(245,158,11,.35), transparent 70%); filter: blur(6px); animation: bootGlow 1.8s ease-in-out infinite; }
      #boot .logo { position: relative; background: #fff; border-radius: 10px; padding: 10px 20px; font: italic 900 28px/1 system-ui, sans-serif; transform: skewX(-6deg); box-shadow: 0 8px 30px rgba(245,158,11,.2); }
      #boot .logo b { color: #000; } #boot .logo i { color: #f59e0b; font-style: italic; }
      #boot .track { position: relative; width: 160px; height: 4px; border-radius: 999px; background: #212121; overflow: hidden; }
      #boot .bar { position: absolute; inset: 0; width: 40%; border-radius: 999px; background: linear-gradient(90deg, transparent, #f59e0b, #fbbf24, #f59e0b, transparent); animation: bootShimmer 1.3s ease-in-out infinite; }
      @keyframes bootGlow { 0%, 100% { opacity: .5; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes bootShimmer { 0% { transform: translateX(-120%); } 100% { transform: translateX(350%); } }
      @media (prefers-reduced-motion: reduce) { #boot .glow, #boot .bar { animation: none; } }
    </style>
    <script>
      // First visit: start the one request the matches screen runs on (every competition, the next ten days) now,
      // while the JS bundle is still downloading, instead of after it has run — src/services/api.js picks the
      // result up. Skipped when the data is already stored, off the matches screen, or when calls go straight to
      // football-data.org (they need the key header).
      (function () {
        try {
          var base = '%VITE_API_BASE_URL%'
          if (base.charAt(0) === '%') base = '/api'
          if (base.indexOf('api.football-data.org') !== -1) return
          // Only the matches screen ("#/", "#/?league=PL", "#/matches/123") runs on this list.
          if (!/^(#\/?(matches\/\d+)?(\?.*)?)?$/.test(location.hash)) return
          // Already stored and still fresh (api.js keeps match lists for 10 minutes): no request needed.
          var fresh = Object.keys(localStorage).some(function (k) {
            if (k.indexOf('matchhub:/matches:') !== 0) return false
            try { return Date.now() - JSON.parse(localStorage.getItem(k)).time < 600000 } catch (e) { return false }
          })
          if (fresh) return
          // Must match upcomingParams() in src/services/api.js, key order included.
          var day = function (n) {
            return new Date(Date.now() + n * 86400000).toLocaleDateString('en-CA', { timeZone: 'Asia/Ho_Chi_Minh' })
          }
          var qs = new URLSearchParams({
            competitions: 'PL,PD,SA,BL1,FL1,CL,ELC,BSA',
            dateFrom: day(0),
            dateTo: day(9),
          }).toString()
          var p = fetch(base + '/matches?' + qs).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json() })
          p.catch(function () {})
          window.__early = {}
          window.__early['/matches?' + qs] = p
        } catch (e) {}
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MatchHub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="MatchHub – Football Schedule" />
    <meta property="og:description" content="Upcoming football fixtures from top leagues." />
    <meta property="og:type" content="website" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://crests.football-data.org" />
    <!-- Web fonts load without blocking the first paint (text shows in the system font, then swaps) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:ital,wght@1,900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:ital,wght@1,900&display=swap" /></noscript>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-hidden="true">
        <span class="glow"></span>
        <span class="logo"><b>Match</b><i>Hub</i></span>
        <div class="track"><div class="bar"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
